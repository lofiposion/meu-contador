<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro projeto</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Olá, mundo!</h1>
      <p id="valor">0</p>
      <button id="botao-somar">Adicionar +1</button>
      <button id="botao-diminuir">Diminuir -1</button>
      <button id="botao-zerar">Zerar</button>
<button id="botao-limpar-historico">Limpar histórico</button>
<section class="secao-estatisticas">
    <h2>Estatísticas</h2>

    <div class="grade-estatisticas">

        <div class="cartao-estatistica">
            <p>Adições</p>
            <span id="total-adicoes">0</span>
        </div>

        <div class="cartao-estatistica">
            <p>Subtrações</p>
            <span id="total-subtracoes">0</span>
        </div>

        <div class="cartao-estatistica">
            <p>Vezes que zerou</p>
            <span id="total-zeradas">0</span>
        </div>

        <div class="cartao-estatistica">
            <p>Total de operações</p>
            <span id="total-operacoes">0</span>
        </div>

    </div>
</section>
        <section>
  <h2>Histórico de operações</h2>
  <ul id="historico"></ul>
</section>
    </main>
  </body>
</html>
